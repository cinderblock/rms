[workspace]
resolver = "3"
members = ["apps/tray/src-tauri", "crates/agent-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cinderblock/rms"
rust-version = "1.85"

[workspace.dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-build = "2.6"
tauri-plugin-updater = "2.10"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rms-agent-core = { path = "crates/agent-core" }

base64 = "0.23"
ed25519-dalek = "3"
gethostname = "1"
keyring = "4"
os_info = "3"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
whoami = "2"
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately NOT `panic = "abort"`: Tauri unwinds across the webview FFI
# boundary, and aborting there turns recoverable errors into silent crashes.
